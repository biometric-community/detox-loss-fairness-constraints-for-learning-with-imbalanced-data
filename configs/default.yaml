device: cuda
data:
  utkface_root: ../../datasets/utkface/extracted
  task: gender
  protocol: 1
  eb_ratio: 0.1
  max_images: null
model:
  image_size: 112
  emb_dim: 128
detox:
  lambda1: 0.01
  lambda2: 0.01
  lambda3: 0.05
train:
  protocol: full
  methods: [softmax, detox]
  epochs: 10
  batch_size: 64
  lr: 0.01
  num_workers: 4
  seed: 42
eval:
  batch_size: 64
  max_images: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  figure_dir: outputs/figures/full
